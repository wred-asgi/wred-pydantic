[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wred-pydantic"
version = "0.2.1"
description = "Pydantic validation and automatic OpenAPI/Swagger UI documentation for Wred"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["wred>=0.13,<0.16", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "openapi-spec-validator>=0.7,<0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
